<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parrela Music School — Private Music & Audio Production Lessons</title>

  <!-- Google Fonts: Outfit (Headings) & Space Mono (Monospace Details) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-cream: #F9F9F6;
      --bg-cream-alt: #F1F0EA;
      --primary-teal: #005B5C;
      --primary-teal-dark: #004344;
      --accent-terracotta: #D95D39;
      --accent-terracotta-hover: #C04D2B;
      --text-main: #182626;
      --text-muted: #4A5D5D;
      --border-subtle: rgba(0, 91, 92, 0.16);
      --font-heading: 'Outfit', sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-cream);
      color: var(--text-main);
      font-family: var(--font-heading);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: var(--font-mono);
    }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-terracotta);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.75rem;
    }

    .eyebrow::before {
      content: "";
      display: inline-block;
      width: 24px;
      height: 2px;
      background-color: var(--accent-terracotta);
    }

    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      color: var(--primary-teal);
      line-height: 1.15;
    }

    h1 {
      font-size: clamp(2.5rem, 5vw, 4.1rem);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    h3 {
      font-size: 1.35rem;
      font-weight: 700;
    }

    .container {
      width: 100%;
      max-width: 1140px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.9rem 1.55rem;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }

    .btn-primary {
      background-color: var(--accent-terracotta);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--accent-terracotta-hover);
      transform: translateY(-2px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--primary-teal);
      border-color: var(--primary-teal);
    }

    .btn-outline:hover {
      background-color: var(--primary-teal);
      color: var(--bg-cream);
    }

    .btn-light {
      background-color: var(--bg-cream);
      color: var(--primary-teal);
    }

    .btn-light:hover {
      background-color: #FFFFFF;
      transform: translateY(-2px);
    }

    /* Navigation */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(249, 249, 246, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 78px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: var(--primary-teal);
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background-color: var(--primary-teal);
      color: var(--bg-cream);
      display: grid;
      place-items: center;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.25rem;
      border-bottom: 3px solid var(--accent-terracotta);
    }

    .logo-text {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
    }

    .logo-text span {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-terracotta);
    }

    nav ul {
      display: flex;
      align-items: center;
      list-style: none;
      gap: 1.85rem;
    }

    nav a {
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.84rem;
      color: var(--primary-teal);
      font-weight: 700;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: var(--accent-terracotta);
    }

    .nav-cta {
      padding: 0.6rem 1.15rem;
      font-size: 0.78rem;
    }

    /* Hero Section */
    .hero {
      padding: 5.5rem 0 4.5rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 3.5rem;
      align-items: center;
    }

    .hero p.lead {
      font-family: var(--font-mono);
      font-size: 1rem;
      color: var(--text-muted);
      margin: 1.5rem 0 2.25rem;
      max-width: 56ch;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .hero-card {
      background-color: var(--primary-teal);
      color: var(--bg-cream);
      padding: 2.25rem;
      border-radius: 12px;
      border-top: 5px solid var(--accent-terracotta);
      box-shadow: 0 18px 36px rgba(0, 91, 92, 0.14);
    }

    .hero-card-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-terracotta);
      background: rgba(249, 249, 246, 0.08);
      display: inline-block;
      padding: 0.35rem 0.7rem;
      border-radius: 4px;
      margin-bottom: 1.25rem;
    }

    .hero-card h3 {
      color: var(--bg-cream);
      margin-bottom: 0.85rem;
      font-size: 1.55rem;
    }

    .hero-specs {
      list-style: none;
      margin-top: 1.25rem;
      border-top: 1px solid rgba(249, 249, 246, 0.16);
    }

    .hero-specs li {
      font-family: var(--font-mono);
      font-size: 0.84rem;
      padding: 0.85rem 0;
      border-bottom: 1px solid rgba(249, 249, 246, 0.16);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .hero-specs li span:first-child {
      color: rgba(249, 249, 246, 0.72);
    }

    .hero-specs li span:last-child {
      font-weight: 700;
      text-align: right;
    }

    /* Sections General */
    section {
      padding: 5.5rem 0;
    }

    .section-header {
      max-width: 700px;
      margin-bottom: 3.25rem;
    }

    .section-header p {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 0.9rem;
    }

    /* Instruments Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 1.85rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-terracotta);
    }

    .card-tag {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-terracotta);
      margin-bottom: 0.75rem;
      display: block;
    }

    .card h3 {
      margin-bottom: 0.65rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.35rem;
    }

    .card-footer {
      font-family: var(--font-mono);
      font-size: 0.76rem;
      color: var(--primary-teal);
      padding-top: 0.9rem;
      border-top: 1px dashed var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .card-footer a {
      color: var(--accent-terracotta);
      text-decoration: none;
      font-weight: 700;
    }

    .card-footer a:hover {
      text-decoration: underline;
    }

    /* Teaching Approach */
    .pillars-section {
      background-color: var(--bg-cream-alt);
      border-top: 1px solid var(--border-subtle);
      border-bottom: 1px solid var(--border-subtle);
    }

    .pillars-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2.25rem;
    }

    .pillar-num {
      font-family: var(--font-mono);
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent-terracotta);
      margin-bottom: 0.6rem;
      display: block;
    }

    .pillar h3 {
      margin-bottom: 0.65rem;
    }

    .pillar p {
      color: var(--text-muted);
      font-size: 0.98rem;
    }

    /* Faculty Preview Banner */
    .faculty-banner {
      background-color: var(--primary-teal);
      color: var(--bg-cream);
      border-radius: 14px;
      padding: 3.5rem;
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 3rem;
      align-items: center;
      border-left: 6px solid var(--accent-terracotta);
    }

    .faculty-banner h2 {
      color: var(--bg-cream);
      margin-bottom: 1rem;
    }

    .faculty-banner p {
      color: rgba(249, 249, 246, 0.88);
      font-size: 1.02rem;
      margin-bottom: 1.75rem;
    }

    .faculty-roster-preview {
      background-color: var(--primary-teal-dark);
      border: 1px solid rgba(249, 249, 246, 0.16);
      border-radius: 10px;
      padding: 1.75rem;
    }

    .faculty-roster-preview h4 {
      color: var(--accent-terracotta);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 1rem;
    }

    .roster-list {
      list-style: none;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }

    .roster-list li {
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(249, 249, 246, 0.12);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    .roster-list li:last-child {
      border-bottom: none;
    }

    .roster-list span:last-child {
      color: rgba(249, 249, 246, 0.72);
      text-align: right;
    }

    /* Rates */
    .rates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 1.75rem;
    }

    .rate-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 2.25rem;
    }

    .rate-card.featured {
      border: 2px solid var(--primary-teal);
      position: relative;
    }

    .rate-badge {
      position: absolute;
      top: -13px;
      right: 20px;
      background-color: var(--accent-terracotta);
      color: #FFFFFF;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .price {
      font-family: var(--font-mono);
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-teal);
